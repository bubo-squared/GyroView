name: Release

# Publishes the npm package `@bubo-squared/gyroview` when a tag `v<version>` is pushed. npm
# trusts this workflow (trusted publishing): no token is stored, and every version carries a
# provenance statement linking it to the commit and the run that built it. The job runs in the
# `npm` environment, where the repository's settings can require a reviewer's approval before
# anything publishes.
# CONTRIBUTING.md has the steps.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag names the package's version
        run: |
          version="v$(node -p "require('./apps/library/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not name the package's version $version."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gyroview/adapter-webcodecs exec playwright install --with-deps chromium webkit
      - run: pnpm verify
      - name: Pack
        working-directory: apps/library
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/bubo-squared-gyroview-*.tgz
