packages:
  - packages/*
  - packages/adapters/*
  - apps/*
  - tools/*
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - mediabunny@1.58.0
  - prettier@3.9.8
# Stryker 10.0.0 pins typed-rest-client ~2.3.0, which pins qs 6.15.1, open to the advisories
# fixed in qs 6.16.1; the minor release keeps its API. Drop this once Stryker moves on.
overrides:
  typed-rest-client>qs: ^6.16.1
  # source-map-js before 1.2.2 lets a crafted source map stall the event loop. Only the toolchain
  # reaches it (ESLint's CSS parser, Vitest's coverage, Vite), never the package. Drop this once
  # they depend on 1.2.2.
  source-map-js: ^1.2.2
  # fast-uri before 3.1.9 mis-normalizes and mis-parses some URIs. Only Stryker reaches it,
  # through ajv, never the package. Drop this once ajv depends on 3.1.9.
  fast-uri: ^3.1.9
  # zod before 4.6.6 can exhaust memory validating an oversized constrained collection. Only
  # Stryker reaches it, through mutation-server-protocol, never the package. Drop this once
  # mutation-server-protocol depends on 4.6.6.
  zod: ^4.6.6
