name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to the commit of the release named beside each, so a moved tag cannot
# change what runs; Dependabot proposes the updates (.github/dependabot.yml).
jobs:
  verify:
    name: Typecheck, lint, format, dependency rules, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @gyroview/adapter-webcodecs exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # The browsers are downloaded once per Playwright version; the system libraries they need
      # are not cached, and are installed on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @gyroview/adapter-webcodecs exec playwright install --with-deps chromium webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @gyroview/adapter-webcodecs exec playwright install-deps chromium webkit
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm depcruise
      - run: pnpm test
      - run: pnpm build
