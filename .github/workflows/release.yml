name: Release

# Publishes the npm package `@bubo-squared/gyroview` when a tag `v<version>` is pushed. npm
# trusts this workflow (trusted publishing): no token is stored, and every version carries a
# provenance statement linking it to the commit and the run that built it.
#
# Two jobs, so that only the one that publishes can ask GitHub for the identity npm trusts: the
# first checks the tag, installs, verifies and packs, running every dev dependency's code with no
# more than read access; the second runs in the `npm` environment, where the repository's
# settings can require a reviewer's approval, once the first has passed, and publishes the
# tarball the first packed without installing anything. CONTRIBUTING.md has the steps.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      node-version: ${{ steps.node.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to tell whether the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release builds from what the registry serves, not from a cache
      # another run wrote.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Name the Node release for the publishing job
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Check that the tag names the package's version
        run: |
          version="v$(node -p "require('./apps/library/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not name the package's version $version."
            exit 1
          fi
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag $GITHUB_REF_NAME is on a commit that main does not contain."
            exit 1
          fi
      - name: Check that the changelog has the version
        run: |
          version="$(node -p "require('./apps/library/package.json').version")"
          if ! grep -qF "## $version (" apps/library/CHANGELOG.md; then
            echo "apps/library/CHANGELOG.md has no heading '## $version (<date>)'."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gyroview/adapter-webcodecs exec playwright install --with-deps chromium webkit
      - run: pnpm verify
      - name: Pack
        working-directory: apps/library
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/bubo-squared-gyroview-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.verify.outputs.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/package/bubo-squared-gyroview-*.tgz --provenance
