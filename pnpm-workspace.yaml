packages:
  - packages/*
  - packages/adapters/*
  - apps/*
  - tools/*
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - mediabunny@1.58.0
  - prettier@3.9.8
# Stryker 10.0.0 pins typed-rest-client ~2.3.0, which pins qs 6.15.1, open to the advisories
# fixed in qs 6.16.0; the minor release keeps its API. Drop this once Stryker moves on.
overrides:
  typed-rest-client>qs: ^6.16.0
